# DigitalOcean App Platform spec.
#   doctl apps create --spec .do/app.yaml          (first time)
#   doctl apps update <app-id> --spec .do/app.yaml (after changing this file)
# Secrets are NOT in this file. Set them as encrypted variables in the App Platform
# console (or in a local, uncommitted copy of this spec) before the first deploy.
name: ontario-doctor-finder
region: tor

# The database is a free Neon PostgreSQL project, not a DigitalOcean cluster.
# Set DATABASE_URL to Neon's direct (non-pooled) connection string as an encrypted variable in the console.
envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    type: SECRET
  - key: DISCOVERY_ENABLED
    value: "true"
  - key: DISCOVERY_SEARCH_PROVIDER
    value: tavily
  - key: TAVILY_API_KEY
    type: SECRET
  - key: SEARCH_RADIUS_KM
    value: "75"
  - key: EXPIRY_DAYS
    value: "30"
  - key: WAITLIST_RADIUS_KM
    value: "8"
  - key: OFFER_BATCH_SIZE
    value: "3"
  - key: OFFER_WINDOW_HOURS
    value: "72"
  - key: LLM_PROVIDER
    value: cohere
  - key: LLM_MODEL
    value: command-a-plus-05-2026
  - key: LLM_API_KEY
    type: SECRET
  - key: ADMIN_PASSWORD
    type: SECRET
  - key: TOKEN_SECRET
    type: SECRET

services:
  - name: web
    github:
      repo: mcruz90/wai_hackathon2026
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npm run build
    run_command: npm run start
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
    envs:
      - key: PORT
        value: "8080"

# Demo setup: only the pre-deploy job runs. The nightly expiry and freshness checks, the
# waitlist check-ins and hourly discovery are not scheduled; run them from the admin screens
# ("Run now", "Search and monitor now") or with npm run job:* when needed.
jobs:
  - name: migrate-and-seed
    kind: PRE_DEPLOY
    github:
      repo: mcruz90/wai_hackathon2026
      branch: main
      deploy_on_push: true
    environment_slug: node-js
    build_command: npx prisma generate
    run_command: npm run db:migrate && npm run db:seed
    instance_count: 1
    instance_size_slug: basic-xxs
