# Development database only. The app runs locally with Node 22 and npm run dev.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: doctor
      POSTGRES_PASSWORD: doctor
      POSTGRES_DB: doctorfinder
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - doctorfinder-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doctor -d doctorfinder"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  doctorfinder-dev:
